<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴시간 알리미</title>
<style>
  :root {
    --ink: #1c2733;
    --muted: #5b6876;
    --paper: #f4f6f8;
    --card: #ffffff;
    --line: #d5dbe2;
    --blue: #cfe4ff;
    --blue-line: #4a8be0;
    --accent: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8edf2;
      --muted: #9aa7b5;
      --paper: #12181f;
      --card: #1b232c;
      --line: #2e3a46;
      --blue: #1f3d63;
      --blue-line: #6aa6f0;
      --accent: #7db3f5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px 14px 40px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 11px 0; font: inherit; font-weight: 700;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--muted); cursor: pointer;
  }
  .tabs button[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent);
  }
  .tabs button:focus-visible, .row button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--blue-line); outline-offset: 2px;
  }

  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  .row input, .row select {
    flex: 1; min-width: 0; padding: 11px 12px; font: inherit;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink);
  }
  .row button {
    padding: 11px 16px; font: inherit; font-weight: 700;
    border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer;
  }
  .hidden { display: none; }

  #msg { min-height: 1.5em; margin: 0 0 10px; color: var(--muted); }
  #msg.error { color: #c0392b; }

  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; min-width: 420px; }
  th, td { border: 1px solid var(--line); text-align: center; padding: 6px 2px; font-size: .9rem; }
  th { background: var(--paper); font-weight: 700; padding: 10px 2px; }
  th.period { width: 44px; }
  td { height: 64px; vertical-align: middle; }
  td.lesson { background: var(--blue); box-shadow: inset 3px 0 0 var(--blue-line); }
  td .top { font-weight: 700; }
  td .bottom { color: var(--muted); font-size: .8rem; }
  td.lesson .bottom { color: var(--ink); opacity: .75; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
</style>
</head>
<body>
<main>
  <h1>컴시간 알리미</h1>
  <p class="sub">교사 이름이나 학급을 고르면 주간 시간표가 나와요.</p>

  <div class="tabs" role="group" aria-label="보기 방식">
    <button type="button" id="tabTeacher" aria-pressed="true">교사별</button>
    <button type="button" id="tabClass" aria-pressed="false">학급별</button>
  </div>

  <div class="row" id="teacherRow">
    <input id="teacherInput" list="teacherList" placeholder="교사 이름 (예: 심가연)" autocomplete="off">
    <datalist id="teacherList"></datalist>
    <button type="button" id="btnTeacher">시간표 보기</button>
  </div>

  <div class="row hidden" id="classRow">
    <select id="classSelect" aria-label="학급 선택"></select>
    <button type="button" id="btnClass">시간표 보기</button>
  </div>

  <p id="msg" role="status"></p>

  <div class="wrap">
    <table id="grid" aria-label="주간 시간표">
      <thead><tr><th class="period">교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

  const DAYS = ["월", "화", "수", "목", "금"];
  const PERIODS = 6;
  const lessons = RAW.map(line => {
    const [day, period, cls, subject, teacher] = line.split(",");
    return { day, period: Number(period), cls, subject, teacher };
  });

  const teachers = [...new Set(lessons.map(l => l.teacher))].sort((a, b) => a.localeCompare(b, "ko"));
  const classes = [...new Set(lessons.map(l => l.cls))].sort();

  const $ = id => document.getElementById(id);
  const tbody = $("grid").querySelector("tbody");

  // 처음 화면: 빈 표 만들기
  function drawEmpty() {
    tbody.innerHTML = "";
    for (let p = 1; p <= PERIODS; p++) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<th class="period">${p}</th>` + DAYS.map(() => "<td></td>").join("");
      tbody.appendChild(tr);
    }
  }

  function fill(list, topKey, bottomKey, highlight) {
    drawEmpty();
    list.forEach(l => {
      const col = DAYS.indexOf(l.day) + 1;
      const td = tbody.rows[l.period - 1].cells[col];
      td.innerHTML = `<div class="top">${l[topKey]}</div><div class="bottom">${l[bottomKey]}</div>`;
      if (highlight) td.classList.add("lesson");
    });
  }

  function say(text, isError) {
    $("msg").textContent = text;
    $("msg").className = isError ? "error" : "";
  }

  function showTeacher() {
    const name = $("teacherInput").value.trim();
    if (!name) { say("교사 이름을 입력해 주세요.", true); drawEmpty(); return; }
    const mine = lessons.filter(l => l.teacher === name);
    if (mine.length === 0) { say(`'${name}' 선생님의 수업을 찾을 수 없어요. 이름을 확인해 주세요.`, true); drawEmpty(); return; }
    say(`${name} 선생님 · 주 ${mine.length}시간`);
    fill(mine, "cls", "subject", true);
  }

  function showClass() {
    const cls = $("classSelect").value;
    const mine = lessons.filter(l => l.cls === cls);
    say(`${cls} 시간표`);
    fill(mine, "subject", "teacher", false);
  }

  function setTab(which) {
    const isTeacher = which === "teacher";
    $("tabTeacher").setAttribute("aria-pressed", isTeacher);
    $("tabClass").setAttribute("aria-pressed", !isTeacher);
    $("teacherRow").classList.toggle("hidden", !isTeacher);
    $("classRow").classList.toggle("hidden", isTeacher);
    say("");
    drawEmpty();
  }

  // 화면 연결
  $("teacherList").innerHTML = teachers.map(t => `<option value="${t}">`).join("");
  $("classSelect").innerHTML = classes.map(c => `<option>${c}</option>`).join("");
  $("tabTeacher").addEventListener("click", () => setTab("teacher"));
  $("tabClass").addEventListener("click", () => setTab("class"));
  $("btnTeacher").addEventListener("click", showTeacher);
